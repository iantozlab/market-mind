services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 8080"
    ports:
      - "3000:8080"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:8080/ | grep -q 'id=\"root\"' || (echo 'vite dev server not responding'; exit 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 180s

volumes:
  node_modules:
